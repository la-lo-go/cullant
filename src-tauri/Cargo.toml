[package]
name = "cullant"
version = "0.7.2"
description = "Fast, keyboard-first photo culling for Windows"
authors = ["Cullant contributors"]
license = "GPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cullant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-saf = { path = "plugins/tauri-plugin-saf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rusqlite = { version = "0.40.1", features = ["bundled"] }
walkdir = "2.5.0"
rayon = "1.12.0"
kamadak-exif = "0.6.1"
image = "0.25.10"
# Direct dep for its IDCT-scaled decode (decode at 1/2..1/8 resolution); the
# image crate's zune-jpeg path has no scaled-decode API.
jpeg-decoder = "0.3"
fast_image_resize = { version = "6.0.0", features = ["image", "rayon"] }
# Pinned exactly: rawler's API is explicitly not SemVer-stable.
rawler = "=0.7.2"
time = { version = "0.3.53", features = ["parsing", "macros"] }
quick-xml = "0.41.0"
xxhash-rust = { version = "0.8.16", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3.27.0"

# Smaller, faster release binaries (notably shrinks the Android .so, which is
# otherwise dominated by symbols). opt-level stays at 3 to keep decode fast.
[profile.release]
strip = true
lto = true
codegen-units = 1

