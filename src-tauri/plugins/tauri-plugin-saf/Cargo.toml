[package]
name = "tauri-plugin-saf"
version = "0.1.0"
description = "Storage Access Framework bridge for Cullant on Android (content:// tree access)."
authors = ["Cullant contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
links = "tauri-plugin-saf"

[lib]
name = "tauri_plugin_saf"
path = "src/lib.rs"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
