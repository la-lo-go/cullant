name: Release

# Publishing a Release in the GitHub web interface starts this workflow. The
# binaries are attached to that same Release, so the tag you chose there is the
# only version input.
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # A tag that disagrees with the manifests would publish binaries whose
      # file names contradict the Release they hang from. Stop before building.
      - name: The tag must agree with the manifests
        id: version
        run: |
          tag="${{ github.event.release.tag_name }}"
          tag="${tag#v}"
          # tauri.conf.json intentionally delegates its version to package.json.
          # Resolve that indirection before comparing the release tag.
          conf=$(node -p "const v=require('./src-tauri/tauri.conf.json').version; v === '../package.json' ? require('./package.json').version : v")
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$conf" ] || [ "$tag" != "$pkg" ]; then
            echo "::error::tag=$tag tauri.conf.json=$conf package.json=$pkg — all three must agree"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

  checks:
    name: Checks
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: rustfmt
        run: cargo fmt --check
        working-directory: src-tauri
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: tests
        run: cargo test
        working-directory: src-tauri

  desktop:
    name: ${{ matrix.name }}
    needs: [guard, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows (nsis + msi)
          # Not ubuntu-latest: an AppImage carries the glibc of the machine that
          # built it, so the oldest available runner reaches the most distros.
          - os: ubuntu-22.04
            name: Linux (deb + AppImage)
          - os: macos-latest
            name: macOS (dmg)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # tauri.conf.json has beforeBuildCommand=npm run build, so this also
      # builds the frontend.
      - run: npm run tauri build
      - name: Attach the bundles to the Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          count=0
          for f in src-tauri/target/release/bundle/*/*.{exe,msi,deb,AppImage,dmg}; do
            echo "uploading $f"
            gh release upload "$TAG" "$f" --clobber
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::the build produced no bundle"
            ls -R src-tauri/target/release/bundle || true
            exit 1
          fi

  android:
    name: Android (apk)
    needs: [guard, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Without the keystore Gradle silently emits an unsigned APK, which
      # nobody can install. Say so now instead of after a ten-minute build.
      - name: The signing secrets must exist
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is empty — see 'Signing in CI' in docs/building.md"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Point Tauri at the runner's NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      # printf, not a heredoc: a password holding a $ must survive verbatim.
      # tr drops CR and LF, which a paste into the secret box can add, and
      # which a .properties value can never carry anyway.
      - name: Write the keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          jks="$RUNNER_TEMP/cullant-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_B64" | tr -d '\r\n' | base64 -d > "$jks"
          # A JKS checks its own integrity with the store password, so a
          # truncated upload and a wrong password fail with the same message.
          # The magic number separates them before either one is blamed.
          magic=$(head -c4 "$jks" | od -An -tx1 | tr -d ' \n')
          case "$magic" in
            feedfeed) echo "format: JKS" ;;
            3082*|3081*) echo "format: PKCS12" ;;
            *)
              echo "::error::the decoded file is no keystore (first bytes $magic). ANDROID_KEYSTORE_B64 is truncated or mangled."
              exit 1
              ;;
          esac
          # Compare these two against the local file to prove the upload is whole.
          echo "size: $(stat -c%s "$jks") bytes"
          echo "sha256: $(sha256sum "$jks" | cut -d' ' -f1)"
          {
            printf 'storeFile=%s\n' "$jks"
            printf 'storePassword=%s\n' "$(printf '%s' "$ANDROID_STORE_PASSWORD" | tr -d '\r\n')"
            printf 'keyAlias=%s\n' "$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n')"
            printf 'keyPassword=%s\n' "$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')"
          } > src-tauri/gen/android/keystore.properties
      # Gradle opens the keystore at the packaging task, eight minutes into the
      # build. keytool answers the same three questions in one second, and it
      # says which of the three secrets is wrong.
      - name: The keystore must open
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          jks="$RUNNER_TEMP/cullant-release.jks"
          store=$(printf '%s' "$ANDROID_STORE_PASSWORD" | tr -d '\r\n')
          alias=$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n')
          key=$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')
          if ! keytool -list -keystore "$jks" -storepass "$store" >/dev/null 2>&1; then
            echo "::error::ANDROID_STORE_PASSWORD does not open the keystore"
            exit 1
          fi
          if ! keytool -list -keystore "$jks" -storepass "$store" -alias "$alias" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEY_ALIAS names no key in this keystore"
            exit 1
          fi
          # -certreq reads the private key, so a wrong key password fails here.
          # It only writes a request to stdout, and changes no file.
          if ! keytool -certreq -keystore "$jks" -storepass "$store" \
                 -alias "$alias" -keypass "$key" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEY_PASSWORD does not unlock the key"
            exit 1
          fi
          echo "keystore, alias and both passwords agree"
      # arm64-v8a only. A universal APK bundles four copies of the native
      # library for four times the size, and covers only pre-2017 phones more.
      - run: npx tauri android build --apk --target aarch64
      - name: Verify the signature and attach the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          # The flavour directory is not fixed. A single --target still runs
          # Gradle's packageUniversalRelease task, so the APK lands under
          # apk/universal/, while --split-per-abi would put it under apk/arm64/.
          # Search the whole tree instead of naming one of them.
          root=src-tauri/gen/android/app/build/outputs/apk
          apk=""
          for f in $(find "$root" -name '*.apk' | sort); do
            case "$f" in *-unsigned.apk|*/debug/*) continue ;; esac
            apk="$f"
          done
          if [ -z "$apk" ]; then
            echo "::error::no signed release APK under $root"
            find "$root" -name '*.apk' || true
            exit 1
          fi
          echo "found $apk"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs "$apk"
          name="cullant-$VERSION-arm64.apk"
          cp "$apk" "$name"
          gh release upload "$TAG" "$name" --clobber
