<!doctype html>
<html lang="en" style="background-color: #222728">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <!-- viewport-fit=cover lets the page extend under Android/iOS system bars and
         display cutouts, which is what makes env(safe-area-inset-*) report real
         values instead of 0. The app then pads itself via those insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- Tint the system status/navigation bars to match the toolbar (--surface-2)
         so the top inset strip reads as one continuous colour with the toolbar. -->
    <meta name="theme-color" content="#2c3334" />
    <!-- A tapped or clicked button must not keep a focus ring: on touch (Android
         WebView) it stays until another element is pressed. Only keyboard focus
         (:focus-visible) draws a ring. -->
    <style>
      button {
        -webkit-tap-highlight-color: transparent;
      }
      button:focus:not(:focus-visible) {
        outline: none;
      }
      button:focus-visible {
        outline: 2px solid var(--accent, #3fdfca);
        outline-offset: 2px;
      }
    </style>
    <title>Tauri + SvelteKit + Typescript App</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
