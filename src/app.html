<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <!-- viewport-fit=cover lets the page extend under Android/iOS system bars and
         display cutouts, which is what makes env(safe-area-inset-*) report real
         values instead of 0. The app then pads itself via those insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Tint the system status/navigation bars to match the toolbar (--surface-2)
         so the top inset strip reads as one continuous colour with the toolbar. -->
    <meta name="theme-color" content="#2c3334" />
    <!-- Kill the focus ring on every button app-wide. On touch (Android WebView)
         a tapped button keeps its :focus outline until another element is
         pressed, which reads as a stray blue border. No button relies on a focus
         style, so remove it everywhere (:focus and :focus-visible) along with the
         tap-highlight flash. -->
    <style>
      button {
        -webkit-tap-highlight-color: transparent;
      }
      button:focus,
      button:focus-visible {
        outline: none !important;
        box-shadow: none !important;
      }
    </style>
    <title>Tauri + SvelteKit + Typescript App</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
